<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALT University жүйесіне кіру</title>
    <style>
        /* Общие стили для минималистичного интерфейса */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .container {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            transition: all 0.3s ease;
        }

        h2 {
            margin-bottom: 24px;
            font-weight: 600;
            text-align: center;
            color: #2c3e50;
        }

        .logo-sub {
            text-align: center;
            font-size: 13px;
            color: #3498db;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #7f8c8d;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: #3498db;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #3498db;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background: #2980b9;
        }

        .toggle-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #7f8c8d;
        }

        .toggle-link span {
            color: #3498db;
            cursor: pointer;
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        /* Блок уведомлений */
        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
            display: none;
            font-weight: 500;
        }
        .success { background: #d4edda; color: #155724; display: block; border-left: 5px solid #28a745; }
        .error { background: #f8d7da; color: #721c24; display: block; border-left: 5px solid #dc3545; }
    </style>
</head>
<body>

<div class="container" id="auth-box">
    
    <!-- КІРУ ФОРМАСЫ -->
    <div id="login-form">
        <div class="logo-sub">ALT University</div>
        <h2>Жүйеге кіру</h2>
        <div class="input-group">
            <label for="login-identifier">Логин немесе Телефон нөмірі</label>
            <input type="text" id="login-identifier" placeholder="User123 немесе +77001112233" required>
        </div>
        <div class="input-group">
            <label for="login-password">Құпия сөз</label>
            <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button onclick="handleLogin()">Кіру</button>
        <div class="toggle-link">
            Тіркелген жоқсыз ба? <span onclick="toggleForms()">Тіркелу</span>
        </div>
    </div>

    <!-- ТІРКЕЛУ ФОРМАСЫ -->
    <div id="register-form" class="hidden">
        <div class="logo-sub">ALT University</div>
        <h2>Тіркелу</h2>
        <div class="input-group">
            <label for="reg-username">Логин</label>
            <input type="text" id="reg-username" placeholder="Логин таңдаңыз" required>
        </div>
        <div class="input-group">
            <label for="reg-phone">Телефон нөмірі</label>
            <input type="tel" id="reg-phone" placeholder="+77001112233" required>
        </div>
        <div class="input-group">
            <label for="reg-password">Құпия сөз</label>
            <input type="password" id="reg-password" placeholder="Құпия сөз ойлап табыңыз" required>
        </div>
        <button onclick="handleRegister()">Тіркелгі жасау</button>
        <div class="toggle-link">
            Аккаунт бар ма? <span onclick="toggleForms()">Кіру</span>
        </div>
    </div>

    <!-- Хабарламалар блогы -->
    <div id="msg-box" class="message"></div>
</div>

<script>
    // Пайдаланушылар базасының эмуляциясы
    const database = [
        { username: "admin", phone: "+77001112233", password: "123" }
    ];

    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const msgBox = document.getElementById('msg-box');

    // Формаларды ауыстыру функциясы
    function toggleForms() {
        loginForm.classList.toggle('hidden');
        registerForm.classList.toggle('hidden');
        msgBox.style.display = 'none';
    }

    // Хабарламаларды көрсету
    function showMessage(text, isSuccess) {
        msgBox.textContent = text;
        msgBox.className = 'message ' + (isSuccess ? 'success' : 'error');
    }

    // Авторизация логикасы (Кіру)
    function handleLogin() {
        const identifier = document.getElementById('login-identifier').value.trim();
        const password = document.getElementById('login-password').value;

        if (!identifier || !password) {
            return showMessage("Өтініш, барлық өрістерді толтырыңыз", false);
        }

        // Логин немесе Телефон бойынша іздеу
        const user = database.find(u => (u.username === identifier || u.phone === identifier) && u.password === password);

        if (user) {
            // Сәтті кіру хабарламасы
            showMessage(`✔ Сәтті! Сіз ${user.username} ретінде кірдіңіз. ALT сайтына өту...`, true);
            
            // 1.5 секундтан кейін ALT сайтына бағыттау
            setTimeout(() => {
                window.location.href = "https://alt.edu.kz/"; 
            }, 1500);
            
        } else {
            showMessage("Қате логин/телефон немесе құпия сөз", false);
        }
    }

    // Тіркелу логикасы
    function handleRegister() {
        const username = document.getElementById('reg-username').value.trim();
        const phone = document.getElementById('reg-phone').value.trim();
        const password = document.getElementById('reg-password').value;

        if (!username || !phone || !password) {
            return showMessage("Өтініш, барлық өрістерді толтырыңыз", false);
        }

        if (database.some(u => u.username.toLowerCase() === username.toLowerCase())) {
            return showMessage("Бұл логин бос емес", false);
        }

        if (database.some(u => u.phone === phone)) {
            return showMessage("Бұл телефон нөмірі тіркеліп қойған", false);
        }

        database.push({ username, phone, password });
        showMessage("Тіркелу сәтті аяқталды! Кіру формасына өту...", true);

        setTimeout(() => {
            toggleForms();
            document.getElementById('login-identifier').value = username;
        }, 1500);
    }
</script>
</body>
</html>
